media:
  input: assets/img/posts
  output: /assets/img/posts

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      primary: title
      sort: title
      order: asc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Short summary (shown in the list and in Google), type: text }
      - { name: categories, label: Categories (max 2), type: string, list: true }
      - { name: tags, label: Tags (lowercase), type: string, list: true }
      - name: image
        label: Cover image
        type: object
        fields:
          - { name: path, label: Image, type: image }
          - { name: alt, label: Image description, type: string }
      - { name: pin, label: Pin to top of homepage, type: boolean }
      - { name: toc, label: Show table of contents, type: boolean }
      - { name: body, label: Content, type: rich-text }

  - name: about
    label: About page
    type: file
    path: _tabs/about.md
    fields:
      - { name: body, label: Content, type: rich-text }
