<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Global oil inventories were 509 million barrels lower at end-September than end-February</title>
<desc id="desc">IEA estimate: global observed oil inventories at end-September 2026 were 509 million barrels below the end-February level.</desc>
<rect width="1100" height="620" rx="24" fill="#f7f5ef"/>
<text x="70" y="78" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#173341">A lower oil price did not mean stocks had rebuilt</text>
<text x="70" y="119" font-family="Arial,sans-serif" font-size="20" fill="#536873">Global observed oil inventories · reported levels at two dates</text>
<text x="80" y="300" font-family="Arial,sans-serif" font-size="112" font-weight="700" fill="#c85c46">−509</text>
<text x="500" y="250" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#173341">million barrels</text>
<text x="500" y="292" font-family="Arial,sans-serif" font-size="21" fill="#536873">lower at end-September</text>
<line x1="130" y1="405" x2="950" y2="405" stroke="#2f7475" stroke-width="6"/>
<path d="M930 388 L958 405 L930 422" fill="none" stroke="#2f7475" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="130" cy="405" r="13" fill="#2f7475"/><circle cx="950" cy="405" r="13" fill="#2f7475"/>
<g font-family="Arial,sans-serif" font-size="19" fill="#344f5b"><text x="95" y="455">End-February 2026</text><text x="785" y="455">End-September 2026</text></g>
<text x="80" y="520" font-family="Arial,sans-serif" font-size="18" fill="#536873">A cumulative stock gap is a buffer measure, not a daily production shortfall.</text>
<text x="80" y="570" font-family="Arial,sans-serif" font-size="15" fill="#7b898c">Source: IEA Oil Market Report, October 2026. Direction is shown; the timeline is not to scale.</text></svg>