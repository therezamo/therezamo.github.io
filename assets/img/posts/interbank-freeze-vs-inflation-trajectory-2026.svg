<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="100%" role="img" aria-label="Timeline of Iran's 10-week interbank rate freeze at 24 percent versus rising inflation near 80 percent and Treasury bill yields">
