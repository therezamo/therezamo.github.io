<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="100%" role="img" aria-label="Iran Central Bank November 2026 Policy Corridor Shift versus 80 Percent Inflation">
  <rect width="860" height="450" rx="12" fill="#0f172a"/>
  
  <text x="45" y="42" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="18" font-weight="bold">Figure 1. Iran's Policy Rate Breakout vs. The ~80% Inflation Wall (Nov 2026)</text>
  <text x="45" y="66" fill="#94a3b8" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="13">Comparison of CBI interbank corridor rates (before and after Aban 1405) against official CPI inflation benchmarks</text>

  <line x1="85" y1="110" x2="810" y2="110" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="72" y="115" fill="#64748b" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="12" text-anchor="end">90%</text>

  <line x1="85" y1="170" x2="810" y2="170" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="72" y="175" fill="#64748b" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="12" text-anchor="end">60%</text>

  <line x1="85" y1="230" x2="810" y2="230" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="72" y="235" fill="#64748b" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="12" text-anchor="end">30%</text>

  <line x1="85" y1="290" x2="810" y2="290" stroke="#475569" stroke-width="1.5"/>
  <text x="72" y="295" fill="#94a3b8" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="12" text-anchor="end">0%</text>

  <rect x="115" y="242" width="85" height="48" rx="5" fill="#64748b"/>
  <text x="157" y="232" fill="#cbd5e1" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">24.0%</text>
  <text x="157" y="318" fill="#e2e8f0" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Old Rate Ceiling</text>
  <text x="157" y="336" fill="#94a3b8" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="11" text-anchor="middle">(10-Week Freeze)</text>

  <rect x="250" y="222" width="85" height="68" rx="5" fill="#0ea5e9"/>
  <text x="292" y="212" fill="#38bdf8" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">33.92%</text>
  <text x="292" y="318" fill="#e2e8f0" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">New Interbank</text>
  <text x="292" y="336" fill="#94a3b8" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="11" text-anchor="middle">(32%–34% Corridor)</text>

  <rect x="385" y="215" width="85" height="75" rx="5" fill="#eab308"/>
  <text x="427" y="205" fill="#facc15" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">~37.5%</text>
  <text x="427" y="318" fill="#e2e8f0" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Akhza Bond YTM</text>
  <text x="427" y="336" fill="#94a3b8" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="11" text-anchor="middle">(Secondary Market)</text>

  <rect x="535" y="136" width="95" height="154" rx="5" fill="#f43f5e"/>
  <text x="582" y="126" fill="#fb7185" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">76.8% (Annual)</text>
  <text x="582" y="318" fill="#e2e8f0" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Annual CPI</text>
  <text x="582" y="336" fill="#94a3b8" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="11" text-anchor="middle">(SCI / ~80% Range)</text>

  <rect x="680" y="113" width="95" height="177" rx="5" fill="#dc2626"/>
  <text x="727" y="103" fill="#fca5a5" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">88.7% (YoY)</text>
  <text x="727" y="318" fill="#e2e8f0" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Point-to-Point</text>
  <text x="727" y="336" fill="#94a3b8" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="11" text-anchor="middle">(SCI Mehr 1405)</text>

  <rect x="45" y="370" width="765" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="393" fill="#f8fafc" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="bold">Key Takeaway:</text>
  <text x="170" y="393" fill="#cbd5e1" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="13">Even after the +9.92 percentage-point hike to 33.92%, Iran's policy rate sits ~43 to ~55 percentage points</text>
  <text x="65" y="412" fill="#cbd5e1" font-family="Inter, system-ui, -apple-system, 'DejaVu Sans', Arial, sans-serif" font-size="13">below headline inflation (~80% average benchmark), leaving real interest rates deeply negative.</text>
</svg>