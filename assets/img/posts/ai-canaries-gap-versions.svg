<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" rx="24" fill="#fbfaf7"/><text x="80" y="82" font-family="Arial,sans-serif" font-size="31" fill="#202a35" font-weight="700">Estimated employment gap for young workers</text><text x="80" y="121" font-family="Arial,sans-serif" font-size="19" fill="#5f6974">Three reported versions of the Stanford study</text><line x1="170" y1="500" x2="1040" y2="500" stroke="#aab1b8" stroke-width="2"/><g font-family="Arial,sans-serif" font-size="20" fill="#4d5965"><text x="255" y="545" text-anchor="middle">Version 1</text><text x="605" y="545" text-anchor="middle">Version 2</text><text x="955" y="545" text-anchor="middle">Version 3</text></g><g fill="#527b9c"><rect x="175" y="305" width="160" height="195" rx="8"/><rect x="525" y="260" width="160" height="240" rx="8"/><rect x="875" y="215" width="160" height="285" rx="8"/></g><g font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#202a35" text-anchor="middle"><text x="255" y="282">13%</text><text x="605" y="237">16%</text><text x="955" y="192">19%</text></g><rect x="80" y="580" width="1040" height="44" rx="8" fill="#f0e8d8"/><text x="100" y="608" font-family="Arial,sans-serif" font-size="17" fill="#604f35">Caution: versions differ in data and method; not directly comparable as a single time series.</text></svg>